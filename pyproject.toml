[project]
name = "backlog-mcp"
version = "0.5.1"
description = "MCP server exposing a markdown-table backlog (and optional scoring CSV) to agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Øystein Olsen" }]
keywords = ["mcp", "backlog", "markdown", "claude", "gemini", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=1.0.0",
  "starlette",
  "uvicorn",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]
dev   = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/oholsen/backlog-mcp"
Issues   = "https://github.com/oholsen/backlog-mcp/issues"

[project.scripts]
backlog-mcp   = "backlog_mcp.server:run"
backlog-agent = "backlog_mcp.server_http:run"
backlog-lint  = "backlog_mcp.lint:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
